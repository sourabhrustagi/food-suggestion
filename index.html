  :root{--bg:#fff8ee;--card:#fff;--ink:#2b1d0e;--accent:#d9480f;--mute:#8a7560}

  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px}
  h1{margin:8px 0 0;font-size:1.6rem}
  .date{color:var(--mute);margin-bottom:12px}
  .bar{display:flex;gap:8px;margin-bottom:16px}
  button{font:inherit;border:1px solid var(--accent);background:none;color:var(--accent);border-radius:8px;padding:6px 12px;cursor:pointer}
  button.on{background:var(--accent);color:#fff}
  .card{background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 1px 4px #0002}
  .slot{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
  .dish{font-size:1.2rem;font-weight:600}
  .card button{padding:4px 10px}
  dialog{max-width:520px;width:92vw;max-height:80vh;overflow:auto;background:var(--card);color:var(--ink);border:0;border-radius:12px}
  dialog::backdrop{background:#0008}
  dialog h3{margin:12px 0 4px}dialog ul{margin:0;padding-left:20px}
</style>

const $ = id => document.getElementById(id);
const today = new Date(), key = today.toISOString().slice(0,10);
const store = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
// deterministic hash so the same day gives the same plan
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
let vegOnly = store.get("veg", true);
let bumps = store.get("bumps:"+key, {}); // per-slot reshuffle counter

function pick(slot){
  const list = MENU[slot].filter(d => !vegOnly || d[1]);
  return list[hash(key+slot+(bumps[slot]||0)) % list.length][0];
}
function render(){
  $("date").textContent = today.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
  $("veg").classList.toggle("on", vegOnly);
  $("all").classList.toggle("on", !vegOnly);
  $("meals").innerHTML = Object.keys(MENU).map(s =>
    `<div class="card"><div><div class="slot">${s}</div><div class="dish">${pick(s)}</div></div>
     <button data-s="${s}" title="Another idea">🔄</button></div>`).join("");
}
$("meals").onclick = e => {
  const s = e.target.dataset.s; if(!s) return;
  bumps[s] = (bumps[s]||0)+1; store.set("bumps:"+key, bumps); render();
};
$("veg").onclick = () => { vegOnly = true; store.set("veg", true); render(); };
$("all").onclick = () => { vegOnly = false; store.set("veg", false); render(); };
$("list").onclick = () => {
  $("dlgbody").innerHTML = Object.entries(MENU).map(([s,l]) =>
    `<h3>${s}</h3><ul>${l.filter(d => !vegOnly || d[1]).map(d => `<li>${d[1]?"🟢":"🔴"} ${d[0]}</li>`).join("")}</ul>`).join("");
  $("dlg").showModal();
};
$("close").onclick = () => $("dlg").close();
$("dlg").onclick = e => { if(e.target.id==="dlg") e.target.close(); };
render();
